<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Workout Tracker</h1>
      <p class="subtitle">Log simple workouts and keep them saved in your browser.</p>
    </header>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Add a Workout</h2>

      <form id="workout-form" class="workout-form">
        <label for="date">Date</label>
        <input id="date" name="date" type="date">

        <label for="type">Workout Type</label>
        <input id="type" name="type" type="text" placeholder="Example: Running">

        <label for="duration">Duration (minutes)</label>
        <input id="duration" name="duration" type="number" min="1" placeholder="Example: 30">

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="4" placeholder="Optional details"></textarea>

        <p id="form-message" class="form-message" aria-live="polite"></p>

        <button type="submit">Save Workout</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">Workout History</h2>
        <p class="section-note">Your saved workouts appear below.</p>
      </div>

      <p id="empty-state" class="empty-state">No workouts yet. Add your first one above.</p>
      <ul id="workout-list" class="workout-list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
